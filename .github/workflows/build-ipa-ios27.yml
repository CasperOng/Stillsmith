name: Build IPA (iOS 27 / Xcode 27)

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_configuration:
        description: 'Build Configuration'
        required: true
        default: 'Release'
        type: choice
        options:
        - Release
        - Debug

env:
  XCODE_VERSION: 'latest'
  BUILD_VARIANT: 'iOS27-Ready'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build and Archive (iOS 27)
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # The build number is the commit count; a shallow clone reports 1.
        fetch-depth: 0

    - name: Setup Latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Select Xcode Version
      run: |
        # Use the latest Xcode available (for future iOS 27 SDK)
        LATEST_XCODE=$(find /Applications -maxdepth 1 -name "Xcode*.app" -not -path "*/Xcode Helper.app" | sort -V | tail -1)
        echo "Using latest Xcode: $LATEST_XCODE"
        if [ -z "$LATEST_XCODE" ]; then
          echo "No Xcode found, using default"
          sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
        else
          sudo xcode-select -switch "$LATEST_XCODE/Contents/Developer"
        fi

    - name: Show Xcode Version
      run: |
        xcodebuild -version
        xcode-select -print-path

    - name: Show Available SDKs
      run: |
        echo "Available iOS SDKs:"
        xcodebuild -showsdks | grep iOS

    - name: Cache Derived Data
      uses: actions/cache@v3
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-ios27-derived-data-${{ hashFiles('**/*.swift', '**/*.m', '**/*.h') }}
        restore-keys: |
          ${{ runner.os }}-ios27-derived-data-

    - name: Get Dynamic Build Info
      id: build_info
      run: |
        # Get the latest iOS SDK (will be iOS 27 when available)
        LATEST_IOS_SDK=$(xcodebuild -showsdks | grep 'iOS' | tail -1 | awk '{print $NF}')
        XCODE_VERSION=$(xcodebuild -version | head -1 | awk '{print $2}')

        echo "ios_sdk=${LATEST_IOS_SDK}" >> $GITHUB_OUTPUT
        echo "xcode_version=${XCODE_VERSION}" >> $GITHUB_OUTPUT

        echo "Latest iOS SDK: ${LATEST_IOS_SDK}"
        echo "Xcode Version: ${XCODE_VERSION}"

    - name: Clean Build Directory
      run: |
        rm -rf build/
        mkdir -p build/

    - name: Update Build Number in Xcode Project
      run: |
        BUILD_NUMBER=$(git rev-list --count HEAD)
        echo "Setting build number to: $BUILD_NUMBER"

        # Update all occurrences of CURRENT_PROJECT_VERSION
        sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" Stillsmith.xcodeproj/project.pbxproj

    - name: Build Project with Latest SDK
      run: |
        set -o pipefail
        xcodebuild \
          -project Stillsmith.xcodeproj \
          -scheme Stillsmith \
          -configuration ${{ github.event.inputs.build_configuration || 'Release' }} \
          -destination "generic/platform=iOS" \
          -archivePath build/Stillsmith-Latest.xcarchive \
          archive \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM="" \
          -allowProvisioningUpdates \
          | tee xcodebuild-latest.log

    - name: Create Payload Directory
      run: |
        mkdir -p build/Payload
        if [ -d "build/Stillsmith-Latest.xcarchive/Products/Applications/Stillsmith.app" ]; then
          cp -r build/Stillsmith-Latest.xcarchive/Products/Applications/Stillsmith.app build/Payload/
        else
          echo "Error: App not found in archive"
          find build/ -name "*.app" -type d
          exit 1
        fi

    - name: Generate IPA
      run: |
        cd build
        zip -r Stillsmith-Latest-unsigned.ipa Payload/

    - name: Verify IPA Structure
      run: |
        cd build
        unzip -l Stillsmith-Latest-unsigned.ipa | head -20
        ls -la Stillsmith-Latest-unsigned.ipa

    - name: Get App Version
      id: app_version
      run: |
        APP_VERSION=$(xcodebuild -project Stillsmith.xcodeproj -showBuildSettings -configuration Release | grep -E 'MARKETING_VERSION' | awk '{print $3}' | head -1)
        BUILD_NUMBER=$(xcodebuild -project Stillsmith.xcodeproj -showBuildSettings -configuration Release | grep -E 'CURRENT_PROJECT_VERSION' | awk '{print $3}' | head -1)
        echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
        echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
        echo "App Version: ${APP_VERSION}"
        echo "Build Number: ${BUILD_NUMBER}"

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stillsmith-iOS27-v${{ steps.app_version.outputs.app_version }}-build${{ steps.app_version.outputs.build_number }}-unsigned
        path: build/Stillsmith-Latest-unsigned.ipa
        retention-days: 30

    - name: Upload Archive Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stillsmith-iOS27-archive-v${{ steps.app_version.outputs.app_version }}
        path: build/Stillsmith-Latest.xcarchive
        retention-days: 7

    - name: Generate Build Summary
      run: |
        echo "## 📱 iOS 27 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **App Version** | ${{ steps.app_version.outputs.app_version }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Build Number** | ${{ steps.app_version.outputs.build_number }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Configuration** | ${{ github.event.inputs.build_configuration || 'Release' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Xcode Version** | ${{ steps.build_info.outputs.xcode_version }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **iOS SDK** | ${{ steps.build_info.outputs.ios_sdk }} (iOS 27 Target) |" >> $GITHUB_STEP_SUMMARY
        echo "| **Runner OS** | ${{ runner.os }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 📦 Artifacts Generated" >> $GITHUB_STEP_SUMMARY
        echo "- **Unsigned IPA (iOS 27)**: \`Stillsmith-iOS27-unsigned.ipa\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Xcode Archive**: \`Stillsmith-iOS27.xcarchive\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔽 Download" >> $GITHUB_STEP_SUMMARY
        echo "The unsigned IPA can be downloaded from the **Artifacts** section of this workflow run." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "> ⚠️ **Note**: This is an unsigned build targeted for iOS 27+. For installation on physical devices, code signing is required." >> $GITHUB_STEP_SUMMARY

    - name: Upload Build Logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs-ios27-${{ github.run_number }}
        path: |
          xcodebuild-ios27.log
          build/
        retention-days: 7

  release:
    name: Create Release (iOS 27)
    runs-on: macos-15
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # The build number is the commit count; a shallow clone reports 1.
        fetch-depth: 0

    - name: Setup Latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Get App Version
      id: app_version
      run: |
        APP_VERSION=$(xcodebuild -project Stillsmith.xcodeproj -showBuildSettings -configuration Release | grep -E 'MARKETING_VERSION' | awk '{print $3}' | head -1)
        # The build job writes the commit count into the project before archiving,
        # so the release job has to read the same number from git, not the checkout.
        BUILD_NUMBER=$(git rev-list --count HEAD)

        # Extract version from Git tag for release title
        GIT_TAG_VERSION=${GITHUB_REF#refs/tags/}
        echo "release_version=${GIT_TAG_VERSION}" >> $GITHUB_OUTPUT
        echo "app_version=${APP_VERSION}" >> $GITHUB_OUTPUT
        echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
        echo "Git Tag Version: ${GIT_TAG_VERSION}"
        echo "App Version: ${APP_VERSION}"
        echo "Build Number: ${BUILD_NUMBER}"

    - name: Download IPA Artifact
      uses: actions/download-artifact@v4
      with:
        name: Stillsmith-iOS27-v${{ steps.app_version.outputs.app_version }}-build${{ steps.app_version.outputs.build_number }}-unsigned
        path: ./release/

    - name: Name the iOS 27 IPA
      run: mv ./release/Stillsmith-Latest-unsigned.ipa ./release/Stillsmith-iOS27-unsigned.ipa


    - name: Attach the iOS 27 build
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        TAG="${GITHUB_REF#refs/tags/}"
        for attempt in $(seq 1 30); do
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ./release/Stillsmith-iOS27-unsigned.ipa --clobber
            exit 0
          fi
          sleep 10
        done
        echo "No release found for $TAG after five minutes; the standard build did not publish it."
        exit 1
