name: Deploy Site

on:
  push:
    branches: ['main']
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  schedule:
    # Keeps stillsmith.is-my.app/sources level with the feed repository.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Build
        working-directory: site
        run: npm run build

      - name: Publish the source URL
        # stillsmith.is-my.app/sources mirrors the feed repository, so the address
        # can be added to Feather, AltStore or SideStore without a GitHub path.
        run: |
          if curl -fsSL --retry 3 --retry-delay 2 --max-time 30 \
              https://raw.githubusercontent.com/CasperOng/stillsmith-feather/main/apps.json \
              -o /tmp/sources \
             && python3 -c "import json; json.load(open('/tmp/sources'))"; then
            cp /tmp/sources site/dist/sources
            cp /tmp/sources site/dist/sources.json
            echo "Published $(wc -c < site/dist/sources) bytes of source JSON"
          else
            echo "Feed unavailable; keeping the snapshot committed in site/public"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
