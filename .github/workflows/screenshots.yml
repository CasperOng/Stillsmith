name: Screenshots

# Captures the app's screens for the website, then publishes them as an artifact.
# The PNGs are copied into site/src/assets/screens and committed with the page.

on:
  workflow_dispatch:

jobs:
  capture:
    name: Capture app screens
    runs-on: macos-15
    timeout-minutes: 30

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Latest Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 'latest'

    - name: Choose a Simulator
      id: simulator
      run: |
        INFO=$(python3 .github/scripts/pick_simulator.py)
        UDID=${INFO%% *}
        NAME=${INFO#* }
        echo "Using $NAME ($UDID)"
        echo "udid=${UDID}" >> "$GITHUB_OUTPUT"

    - name: Boot the Simulator
      run: |
        UDID="${{ steps.simulator.outputs.udid }}"
        xcrun simctl boot "$UDID" 2>/dev/null || true
        xcrun simctl bootstatus "$UDID" -b

    - name: Run Screenshot Tests
      run: |
        set -o pipefail
        xcodebuild test \
          -project Stillsmith.xcodeproj \
          -scheme Stillsmith \
          -destination "id=${{ steps.simulator.outputs.udid }}" \
          -only-testing:StillsmithUITests/StillsmithScreenshotTests \
          -parallel-testing-enabled NO \
          -test-timeouts-enabled YES \
          -default-test-execution-time-allowance 180 \
          -maximum-test-execution-time-allowance 420 \
          -resultBundlePath build/Screenshots.xcresult \
          | tee xcodebuild-screenshots.log

    - name: Export Screenshots
      if: always()
      run: |
        mkdir -p build/screens
        xcrun xcresulttool export attachments \
          --path build/Screenshots.xcresult \
          --output-path build/screens || true
        ls -la build/screens
        cat build/screens/manifest.json 2>/dev/null | head -60 || true

    - name: Upload Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-screenshots
        path: build/screens
        retention-days: 30

    - name: Upload Logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: screenshot-logs-${{ github.run_number }}
        path: xcodebuild-screenshots.log
        retention-days: 7
